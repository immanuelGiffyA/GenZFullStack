<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-purple-50 flex items-start justify-center py-12 px-4">

  <div class="w-full max-w-lg">

    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-semibold text-gray-800 mb-1">My Tasks</h1>
      <p id="date-label" class="text-sm text-gray-400"></p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">

      <!-- Input Row -->
      <div class="flex gap-2 mb-5">
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task..."
          maxlength="120"
          class="flex-1 h-10 px-3 text-sm rounded-lg border border-gray-200 bg-white text-gray-800 placeholder-gray-400 transition"
        />
        <select
          id="priority-select"
          class="h-10 px-3 text-sm rounded-lg border border-gray-200 bg-white text-gray-600 cursor-pointer transition"
        >
          <option value="low">🟢 Low</option>
          <option value="med" selected>🟡 Med</option>
          <option value="high">🔴 High</option>
        </select>
        <button
          id="add-btn"
          class="h-10 px-5 rounded-lg bg-violet-600 text-white text-sm font-medium"
        >Add</button>
      </div>

      <!-- Progress Bar -->
      <div class="h-1.5 bg-gray-100 rounded-full mb-5 overflow-hidden">
        <div id="progress-fill" class="progress-fill h-full bg-gradient-to-r from-violet-500 to-purple-400 rounded-full" style="width: 0%"></div>
      </div>

      <!-- Filters + Stats -->
      <div class="flex items-center gap-2 mb-4 flex-wrap">
        <button class="filter-btn text-xs px-3 h-7 rounded-full border border-gray-200 text-gray-500 active" data-filter="all">All</button>
        <button class="filter-btn text-xs px-3 h-7 rounded-full border border-gray-200 text-gray-500" data-filter="active">Active</button>
        <button class="filter-btn text-xs px-3 h-7 rounded-full border border-gray-200 text-gray-500" data-filter="done">Done</button>
        <span id="stats-label" class="ml-auto text-xs text-gray-400"></span>
        <button id="clear-done" class="text-xs text-gray-400 hover:text-red-500 transition px-1">Clear done</button>
      </div>

      <!-- Todo List -->
      <ul id="todo-list" class="flex flex-col gap-2"></ul>

    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-300 mt-6">Saved automatically to your browser</p>
  </div>

<script src="./script.js"></script>
</body>
</html>
